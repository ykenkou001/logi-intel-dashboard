[project]
name = "logi-intel-dashboard"
version = "0.1.0"
description = "物流業界向け日本オープンデータ統合基盤（MCP サーバー + Web ダッシュボード）"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
    "fastmcp>=2.0",
    "python-dotenv>=1.0",
    "beautifulsoup4>=4.12",
    "python-pptx>=1.0",
    "openpyxl>=3.1",
    "python-docx>=1.1",
    "fastapi>=0.136.1",
    "uvicorn[standard]>=0.46.0",
    "python-multipart>=0.0.27",
    "boto3>=1.43.2",
    "boto3-stubs[s3,ssm]>=1.43.2",
    "mangum>=0.21.0",
]

[dependency-groups]
dev = [
    "ruff>=0.6",
    "mypy>=1.11",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "httpx>=0.28.1",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "RUF"]
# 日本語プロジェクトのため全角カッコ（）を意図的に許容する
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.mypy]
strict = true
python_version = "3.12"

[[tool.mypy.overrides]]
module = ["openpyxl.*", "pptx.*", "docx.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.coverage.run]
source = ["core", "mcp_server"]
omit = ["tests/*"]
