# ローカル開発用の docker-compose 定義
#
# 用途:
#   - FastAPI バックエンドと Redis を一発起動
#   - AWS 移行前に「Redis ベースのキャッシュ層」をローカルで検証する
#
# 起動:
#   docker compose up --build
# 停止:
#   docker compose down

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: logi-intel-api:dev
    ports:
      - "8000:8000"
    environment:
      # AWS 移行時のキャッシュ切替準備（現状 SQLite。Redis 化はフェーズ4.0 後半）
      LOGI_CACHE_BACKEND: ${LOGI_CACHE_BACKEND:-sqlite}
      LOGI_REDIS_URL: redis://redis:6379/0
      LOGI_API_CORS_ORIGINS: ${LOGI_API_CORS_ORIGINS:-*}
      # API キーは .env から注入。secrets 平文コミットは厳禁
      ESTAT_APP_ID: ${ESTAT_APP_ID:-}
      CORP_NUMBER_APP_ID: ${CORP_NUMBER_APP_ID:-}
    volumes:
      - ./outputs:/app/outputs
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health').status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3

  redis:
    image: redis:7.4-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    volumes:
      - redis-data:/data

volumes:
  redis-data:
